name: BookVoiceLab
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BookVoiceLab:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BookVoiceLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeebasit.bookvoicelab
        INFOPLIST_FILE: BookVoiceLab/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BookVoiceLab:
    build:
      targets:
        BookVoiceLab: all
    run:
      config: Debug
    archive:
      config: Release
